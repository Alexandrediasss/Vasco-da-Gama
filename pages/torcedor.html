<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torcedor - Vasco da Gama</title>
    <link rel="stylesheet" href="../css/torcedor.css">
</head>

<body>
    <header>
        <div class="filho-1">
            <a href="../"><img class="escudo-img" src="../img/vasco-escudo.png" alt="Escudo do Vasco"></a>
            <text>Vasco Da Gama</text>
        </div>
        <nav>
            <ul>
                <li><a href="../">Home</a></li>
                <li><a href="../pages/historia.html">História</a></li>
                <li><a href="../pages/titulos.html">Títulos</a></li>

                <li><a href="../pages/torcedor.html">Torcedor</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Área do Torcedor</h1>
        <p>
            Faça parte da maior torcida do Brasil! Preencha o formulário abaixo para se cadastrar como torcedor do Gigante da Colina.
        </p>
        <form>
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Digite seu email" required>

            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

            <button type="submit">Enviar</button>
        </form>
    </main>
</body>

</html>
